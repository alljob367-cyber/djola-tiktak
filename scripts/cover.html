<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
@page{size:210mm 297mm;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:210mm;height:297mm;font-family:'Inter',sans-serif;background:#3d3a2e}
.cover{position:relative;width:100%;height:100%;background:linear-gradient(155deg,#3d3a2e 0%,#5c5640 40%,#756c53 100%)}
.bar{position:absolute;top:0;left:0;width:8px;height:100%;background:linear-gradient(180deg,#897129 0%,#b8942e 100%)}
.content{position:absolute;top:140px;left:80px;z-index:2}
.tag{display:block;font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#b8942e;margin-bottom:20px;padding:6px 14px;border:1px solid rgba(185,148,46,0.4);border-radius:3px;width:fit-content}
.t1{font-size:40px;font-weight:900;color:#f1f1f0;line-height:1.2;margin-bottom:6px}
.t2{font-size:28px;font-weight:300;color:#b8942e;line-height:1.3;margin-bottom:18px}
.sub{font-size:13px;font-weight:300;color:rgba(241,241,240,0.6);line-height:1.7;margin-bottom:40px;max-width:420px}
.meta{font-size:11px;color:rgba(241,241,240,0.4);line-height:1.8}
.score{position:absolute;bottom:80px;right:70px;width:160px;height:160px;border-radius:50%;border:3px solid rgba(185,148,46,0.3);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;background:rgba(61,58,46,0.5)}
.snum{font-size:50px;font-weight:900;color:#b8942e;line-height:1}
.slab{font-size:10px;color:rgba(241,241,240,0.45);margin-top:6px;letter-spacing:2px;text-transform:uppercase}
.bot{position:absolute;bottom:0;left:0;width:100%;height:5px;background:linear-gradient(90deg,#897129,#b8942e,#897129)}
</style></head><body>
<div class="cover">
<div class="bar"></div>
<div class="content">
<div class="tag">Rapport d'Audit</div>
<div class="t1">Djola TikTak</div>
<div class="t2">Audit General du Produit</div>
<div class="sub">Analyse fonctionnelle, securitaire et commerciale. Note detaillee par module, valeur marchande, couts et feuille de route strategique.</div>
<div class="meta">Aout 2026<br>Confidentiel</div>
</div>
<div class="score">
<div class="snum">58</div>
<div class="slab">sur 100</div>
</div>
<div class="bot"></div>
</div>
</body></html>
